<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascading Stylesheet</title>
    <!-- CSS EMBEDDED (embutido) -->
    <style>
        p {
            font-size: 150px;
        }

        #gato {
            color: yellowgreen;
        }

        #cachorro {
            color: palevioletred;
        }
    </style>
</head>

<body>

    <!-- CSS INLINE é aquele que vai dentro da própria tag -->
    <p style="color: rebeccapurple; font-size: 200px;">Isabela</p>
    <p id="cachorro">Lili</p>
    <p id="gato">Maya Maria</p>

</body>

</html>
