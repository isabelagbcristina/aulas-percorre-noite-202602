<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULÁRIO 02</title>
</head>

<body>
    <header>

    </header>

    <main>
        <form action="">
            <label for="">INSIRA SEU E-MAIL:</label>
            <input type="email" name="email" id="email" required="true" placeholder="isa123@gmail.com">

            <br>
            <br>

            <label for="">INSIRA SEU NOME:</label>
            <input type="text" name="nomw" id="nome" required="true" maxlength="100" placeholder="Isabela Cristina">

            <br>
            <br>

            <label for="color">ESCOLHA UMA COR:</label>
            <input type="color" name="color" id="color">

            <br>
            <br>

            <label for="">AVALIE O ATENDIMENTO:</label>
            <br>

            <input type="radio" name="estrelas" id="3 estrelas" value="3">
            <label for="3 estrelas ">⭐⭐⭐</label>
            <br>

            <input type="radio" name="estrelas" id="2 estrelas" value="2">
            <label for="2 estrelas">⭐⭐</label>
            <br>

            <input type="radio" name="estrelas" id="1 estrela" value="1">
            <label for="1 estrela">⭐</label>
            
            <br>
            <br>

            <label for="comentario">DEIXE UM COMENTÁRIO:</label>
            <br>
            <textarea name="" id="comentario" placeholder="Escreva aqui" cols="30" rows="10"></textarea>

            <br>
            <br>

            <input type="submit" value="ENVIAR!">

        </form>
    </main>

    <footer>

    </footer>
</body>

</html>
